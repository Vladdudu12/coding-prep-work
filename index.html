<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer JSON - Interviuri Tehnice</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --accent: #007bff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #output {
            margin-top: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 10px;
            margin-bottom: 15px;
        }

        .badge-medium { background: #e2e3e5; color: #383d41; }
        .badge-topic { background: #cce5ff; color: #004085; }
        .badge-score { font-size: 16px; float: right; background: #d4edda; color: #155724; }

        .verdict-Corect { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .verdict-Aproape { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .verdict-Parțial { background: #ffeeba; color: #856404; }
        .verdict-Incorect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            color: var(--accent);
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .code-block {
            background: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: auto;
            margin-top: 5px;
        }

        ul {
            margin-top: 5px;
            padding-left: 20px;
        }

        ul li {
            margin-bottom: 5px;
        }

        .error {
            color: var(--danger);
            background: #f8d7da;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Viewer JSON - Prep Interviu</h1>
    <textarea id="jsonInput" placeholder="Lipește codul JSON (Problemă sau Evaluare) aici..."></textarea>
    <button onclick="renderJSON()">Vizualizează</button>
    <div id="output"></div>
</div>

<script>
    function renderJSON() {
        const input = document.getElementById('jsonInput').value.trim();
        const output = document.getElementById('output');
        output.innerHTML = '';

        if (!input) {
            output.innerHTML = '<div class="error">Te rog introdu un JSON valid.</div>';
            return;
        }

        try {
            const data = JSON.parse(input);

            if (data.title && data.description) {
                renderProblem(data, output);
            } else if (data.verdict && data.score !== undefined) {
                renderEvaluation(data, output);
            } else {
                output.innerHTML = '<div class="error">JSON-ul este valid, dar nu se potrivește cu formatul așteptat (Problemă sau Evaluare).</div>';
            }
        } catch (e) {
            output.innerHTML = `<div class="error"><strong>Eroare de parsare JSON:</strong><br>${e.message}</div>`;
        }
    }

    function renderProblem(data, container) {
        let html = `<div class="card">
            <h2 style="margin-top: 0;">${data.title}</h2>
            <div>
                <span class="badge badge-medium">Dificultate: ${data.difficulty}</span>
                <span class="badge badge-topic">Topic: ${data.topic}</span>
            </div>
            <p>${data.description}</p>
            
            <div class="section-title">Input / Output așteptat</div>
            <p><strong>Input:</strong> ${data.input}</p>
            <p><strong>Output:</strong> ${data.output}</p>

            <div class="section-title">Constrângeri</div>
            <p>${data.constraints}</p>

            <div class="section-title">Exemplu</div>
            <strong>Intrare:</strong>
            <div class="code-block">${data.exampleInput}</div>
            <strong>Ieșire:</strong>
            <div class="code-block">${data.exampleOutput}</div>

            <div class="section-title">Hint-uri pentru Cazuri Limită (Edge Cases)</div>
            <ul>`;
        
        data.edgeCasesHint.forEach(hint => {
            html += `<li>${hint}</li>`;
        });

        html += `</ul></div>`;
        container.innerHTML = html;
    }

    function renderEvaluation(data, container) {
        let verdictClass = 'verdict-Aproape';
        if (data.verdict.includes('Corect') && !data.verdict.includes('Parțial') && !data.verdict.includes('Aproape')) verdictClass = 'verdict-Corect';
        if (data.verdict.includes('Incorect')) verdictClass = 'verdict-Incorect';
        if (data.verdict.includes('Parțial')) verdictClass = 'verdict-Parțial';

        let html = `<div class="card">
            <span class="badge badge-score">Scor: ${data.score} / 100</span>
            <div class="badge ${verdictClass}" style="font-size: 14px;">Verdict: ${data.verdict}</div>
            
            <p><strong>Rezumat:</strong> ${data.summary}</p>
            
            <div class="section-title">Analiza Soluției</div>
            <p><strong>Corectitudine:</strong> ${data.correctness}</p>
            <p><strong>Structuri de Date:</strong> ${data.dataStructureChoice}</p>
            <p><strong>Complexitate:</strong> ${data.complexity}</p>
            <p><strong>Calitatea Codului:</strong> ${data.codeQuality}</p>

            <div style="display: flex; gap: 20px;">
                <div style="flex: 1;">
                    <div class="section-title" style="color: var(--success);">Cazuri limită tratate</div>
                    <ul>${data.edgeCasesHandled.map(e => `<li>${e}</li>`).join('')}</ul>
                </div>
                <div style="flex: 1;">
                    <div class="section-title" style="color: var(--danger);">Cazuri limită omise</div>
                    <ul>${data.edgeCasesMissed.length ? data.edgeCasesMissed.map(e => `<li>${e}</li>`).join('') : '<li>Niciunul (bine lucrat!)</li>'}</ul>
                </div>
            </div>

            <div class="section-title">Îmbunătățiri Recomandate</div>
            <ul>${data.improvements.map(i => `<li>${i}</li>`).join('')}</ul>

            <div class="section-title" style="color: #6f42c1;">Follow-up Question</div>
            <div style="background: #f8f9fa; padding: 15px; border-left: 4px solid #6f42c1; font-style: italic;">
                ${data.followUpQuestion}
            </div>
        </div>`;
        
        container.innerHTML = html;
    }
</script>

</body>
</html>
